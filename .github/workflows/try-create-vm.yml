name: Try to Create OCI VM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Setup OCI credentials
        env:
          KEY_B64: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p /home/runner/.oci
          echo "$KEY_B64" | base64 -d > /home/runner/.oci/key.pem
          chmod 600 /home/runner/.oci/key.pem
          
          cat > /home/runner/.oci/config << CFG
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=/home/runner/.oci/key.pem
          CFG
          
          chmod 600 /home/runner/.oci/config
          echo "=== Key size ==="
          wc -c /home/runner/.oci/key.pem
          echo "=== Config ==="
          cat /home/runner/.oci/config
          echo "=== Test connection ==="
          oci iam region list --output table | head -5

      - name: Try Create VM
        env:
          CID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SID: ${{ secrets.OCI_SUBNET_ID }}
          IID: ${{ secrets.IMAGE_ID }}
        run: |
          for AD in "Uocm:EU-FRANKFURT-1-AD-1" "Uocm:EU-FRANKFURT-1-AD-2" "Uocm:EU-FRANKFURT-1-AD-3"; do
            echo "=== Trying $AD ==="
            if oci compute instance launch --availability-domain "$AD" --compartment-id "$CID" --shape "VM.Standard.A1.Flex" --shape-config '{"ocpus": 2, "memoryInGBs": 12}' --image-id "$IID" --subnet-id "$SID" --assign-public-ip true --display-name "Asia" 2>&1; then
              echo "SUCCESS!"
              exit 0
            fi
          done
          echo "All ADs failed"
          exit 1
