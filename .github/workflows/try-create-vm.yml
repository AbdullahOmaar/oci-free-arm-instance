name: Try to Create OCI VM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Setup OCI credentials
        env:
          KEY_B64: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_FP: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_TEN: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_REG: ${{ secrets.OCI_CLI_REGION }}
        run: |
          mkdir -p ~/.oci
          echo "$KEY_B64" | base64 -d > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s/.oci/key.pem\n' "$OCI_USER" "$OCI_FP" "$OCI_TEN" "$OCI_REG" "$HOME" > ~/.oci/config
          chmod 600 ~/.oci/config
          echo "=== Config ==="
          cat ~/.oci/config
          echo "=== Test ==="
          oci iam region list --output table | head -5

      - name: Try Create VM
        env:
          CID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SID: ${{ secrets.OCI_SUBNET_ID }}
          IID: ${{ secrets.IMAGE_ID }}
        run: |
          for AD in "Uocm:EU-FRANKFURT-1-AD-1" "Uocm:EU-FRANKFURT-1-AD-2" "Uocm:EU-FRANKFURT-1-AD-3"; do
            echo "=== Trying $AD ==="
            if oci compute instance launch --availability-domain "$AD" --compartment-id "$CID" --shape "VM.Standard.A1.Flex" --shape-config '{"ocpus": 2, "memoryInGBs": 12}' --image-id "$IID" --subnet-id "$SID" --assign-public-ip true --display-name "Asia" 2>&1; then
              echo "SUCCESS!"
              exit 0
            fi
          done
          echo "All ADs failed"
          exit 1
